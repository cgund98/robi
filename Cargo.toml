[workspace]
resolver = "2"
members = ["crates/robi", "crates/robi-core", "src-tauri"]

[workspace.package]
version = "0.1.11"
edition = "2021"
rust-version = "1.90"
license = "MIT"

# Dev and test builds carry line tables but no full debug info. Link time and
# `target/` size are dominated by DWARF, and a 200 MB `librobi-*.rlib` links
# into every test binary. `line-tables-only` keeps file:line in backtraces,
# which is what a failing test needs, and drops the rest.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Every dependency is declared once here so versions cannot drift between crates.
[workspace.dependencies]
async-trait = "0.1.83"
bytes = "1.10.1"
futures-util = "0.3.31"
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
scraper = "0.23"
url = "2.5"
sha2 = "0.10.9"
similar = "2.7.0"
regex = "1.11.2"
ignore = "0.4.23"
globset = "0.4.16"
thiserror = "2.0.20"
# The `data:` URI in a chat-completions image part needs base64 (D12).
base64 = "0.22.1"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.19"
tracing = "0.1.41"
uuid = { version = "1.24.0", features = ["v7", "serde"] }

# Local HTTP API (`robi-api`) and the fake SSE server in provider tests.
axum = { version = "0.8.4", features = ["multipart", "macros", "json"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
toml = "0.8.23"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# The CORS layer in `bootstrap`, and `ServiceExt` in the docs-viewer tests.
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors"] }

redb = "2.6.3"

# The terminal front end (T0). Feature-gated in `robi`, so `robi-api` and
# `src-tauri` never compile it. `crossterm` comes from `ratatui::crossterm`: a
# second direct version in the tree fails to typecheck on `KeyEvent`.
ratatui = "0.30"
# The composer's multi-line field. It depends on `ratatui-core`,
# `ratatui-crossterm`, and `ratatui-widgets` at the same majors ratatui 0.30
# already resolves, so `KeyEvent` stays one type across the tree.
ratatui-textarea = "0.9"
# Assistant markdown -> a ratatui `Text`. Pinned to the major that depends on
# `ratatui-core 0.1`, which is what ratatui 0.30 already resolves.
# `default-features = false` drops the optional `syntect` code highlighter: it is
# a large build cost for one view, and the TUI's code blocks read fine in
# `--code-ink`.
tui-markdown = { version = "0.3", default-features = false }
unicode-width = "0.2"

# The desktop shell. Versions stay here so they cannot drift.
tauri = { version = "2", features = ["devtools"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify-rust = "4"
mac-notification-sys = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent"] }
block2 = "0.6.2"

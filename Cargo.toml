[workspace]
resolver = "2"
members = ["crates/robi", "crates/robi-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

# Every dependency is declared once here so versions cannot drift between crates.
[workspace.dependencies]
async-trait = "0.1.83"
bytes = "1.10.1"
futures-util = "0.3.31"
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.19"
tracing = "0.1.41"
uuid = { version = "1.24.0", features = ["v7", "serde"] }

# Test-only, for the fake SSE server that stands in for a provider.
axum = "0.8.4"


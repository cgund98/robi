[workspace]
resolver = "2"
members = ["crates/robi", "crates/robi-core", "crates/robi-index", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

# Every dependency is declared once here so versions cannot drift between crates.
[workspace.dependencies]
async-trait = "0.1.83"
bytes = "1.10.1"
futures-util = "0.3.31"
futures-io = "0.3.31"
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
scraper = "0.23"
url = "2.5"
sha2 = "0.10.9"
similar = "2.7.0"
regex = "1.11.2"
ignore = "0.4.23"
globset = "0.4.16"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.19"
tracing = "0.1.41"
uuid = { version = "1.24.0", features = ["v7", "serde"] }

# Local HTTP API (`robi-api`) and the fake SSE server in provider tests.
axum = "0.8.4"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
toml = "0.8.23"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Language server client (M7). `robi` is the only crate that speaks LSP.
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tokio", "tracing"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors"] }

# Semantic index (M7). Heavy on purpose, and only `robi-index` depends on them.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-md = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
notify = "8"
fastembed = "7"

# The desktop shell. Versions stay here so they cannot drift.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify-rust = "4"
mac-notification-sys = "0.6"


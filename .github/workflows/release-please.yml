# Requires Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". Without that, release-please cannot open release PRs.
#
# The desktop builds run in this same workflow, gated on the release output. A
# separate workflow on `release: published` would not fire: events created with
# the repository GITHUB_TOKEN do not start new workflow runs. Chaining
# in-workflow avoids needing a PAT or GitHub App token for release-please.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The DMG is unsigned (ad-hoc signed).
          - name: macos
            platform: macos-latest
            bundles: dmg
          # Built on 22.04 for an older glibc baseline. The AppImage bundles its
          # own runtime dependencies; the deb needs libwebkit2gtk-4.1 at runtime.
          - name: linux
            platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90'

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.name == 'macos' && '-' || '' }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Collect bundles
        run: |
          set -euo pipefail
          mkdir -p release
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -l release

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  # Combine the per-platform bundles into one set of release assets, so the
  # release carries a single checksums file covering every artifact.
  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release/* --repo "${{ github.repository }}" --clobber

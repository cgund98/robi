[package]
name = "robi"
description = "I/O behind the Robi loop: model providers and the local session API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
robi-core = { path = "../robi-core" }
robi-index = { path = "../robi-index" }

async-lsp.workspace = true
async-trait.workspace = true
tower.workspace = true
axum = { workspace = true, features = ["macros"] }
bytes.workspace = true
chrono.workspace = true
futures-io.workspace = true
futures-util.workspace = true
http.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
sqlx.workspace = true
thiserror.workspace = true
toml.workspace = true
# `net` and `rt-multi-thread` drive `robi-api` and the provider-test SSE server.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "process", "io-util"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
rmcp = { version = "0.12", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

[[bin]]
name = "robi-api"
path = "src/bin/robi-api.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

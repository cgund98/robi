[package]
name = "robi"
description = "I/O behind the Robi loop: model providers and the local session API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
robi-core = { path = "../robi-core" }

async-trait.workspace = true
axum = { workspace = true, features = ["macros"] }
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
http.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
toml.workspace = true
# `net` and `rt-multi-thread` drive `robi-api` and the provider-test SSE server.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "process"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true

[[bin]]
name = "robi-api"
path = "src/bin/robi-api.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

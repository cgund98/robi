[package]
name = "robi"
description = "I/O behind the Robi loop: model providers and the local session API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Every workstream in `docs/src/streamlining.md` is off by default: the
# streamlined harness ships. Each feature is the restore path for one
# workstream. The two non-obvious edges are load-bearing; see
# `docs/src/design/core/feature-switches.md`.
default = []
# S3: the `semantic_search` tool, `IndexHub`, the index routes, and embeddings.
semantic-index = ["dep:robi-index", "robi-index/local-embed"]
# S1 (read half): `read_file`, `read_code`, `list_dir`, `find`, `grep`.
# Tree-sitter outline comes back; embeddings do not.
read-tools = ["dep:robi-index"]
# S4: the five language-server tools. The client in `agent/lsp/` stays.
lsp-tools = []
# S2: the session review routes, and the `review`/`session` baseline reader.
review = []
# S1 (write half): `write_file`, `edit_file`, `delete_file`. The diff helpers
# and their tests use the review half, hence the edge.
edit-tools = ["review"]
# S5: `web_api/docs.rs` and its four routes. Its search reads the index.
docs-viewer = ["semantic-index"]
# T0: the terminal front end in `tui/` and the `robi-tui` binary. Not a
# streamlining workstream: off by default so `robi-api` and `src-tauri` do not
# compile ratatui. `tokio/signal` is for SIGTERM -> restore.
tui = [
    "dep:ratatui",
    "dep:ratatui-textarea",
    "dep:tui-markdown",
    "dep:unicode-width",
    "tokio/signal",
]
[dependencies]
robi-core = { path = "../robi-core" }
# Optional: after S1 the default build has no user of `robi-index` at all, which
# drops tree-sitter and `fastembed` with it.
robi-index = { path = "../robi-index", default-features = false, optional = true }

async-lsp.workspace = true
async-trait.workspace = true
base64.workspace = true
tower.workspace = true
tower-http.workspace = true
axum = { workspace = true, features = ["macros"] }
bytes.workspace = true
chrono.workspace = true
futures-io.workspace = true
futures-util.workspace = true
http.workspace = true
globset.workspace = true
ignore.workspace = true
redb.workspace = true
regex.workspace = true
ratatui = { workspace = true, optional = true }
ratatui-textarea = { workspace = true, optional = true }
tui-markdown = { workspace = true, optional = true }
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
sqlx.workspace = true
thiserror.workspace = true
toml.workspace = true
# `net` and `rt-multi-thread` drive `robi-api` and the provider-test SSE server.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "process", "io-util"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unicode-width = { workspace = true, optional = true }
url.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
rmcp = { version = "0.12", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# The container sandbox in `agent/sandbox/container/`. Selected at run time by
# `sandbox_mechanism`, not by a Cargo feature: one switch, not two.
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }

[[bin]]
name = "robi-api"
path = "src/bin/robi-api.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

# The terminal front end. `required-features` keeps it out of a default build,
# so `cargo build` never compiles ratatui.
[[bin]]
name = "robi-tui"
path = "src/bin/robi-tui.rs"
required-features = ["tui"]
